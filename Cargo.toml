[workspace]
resolver = "3"
members = ["crates/step21", "crates/rm-map-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["hxyulin <hxyulin@proton.me>"]
repository = "https://github.com/hxyulin/rm-map-tools"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
step21 = { path = "crates/step21" }
memmap2 = "0.9"
rayon = "1.10"
memchr = "2.7"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
debug = 1
